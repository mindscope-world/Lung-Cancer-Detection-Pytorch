<!DOCTYPE html>
<html>
<head>
    <title>Lung Cancer Prediction</title>
</head>
<body>
    <h1>Upload a Lung Scan Image</h1>

        <input type="file" name="image" required>
        <button type="submit">Predict</button>
    </form>
</body>
</html>
